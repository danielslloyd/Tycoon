<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oil &amp; Gas Tycoon</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="topbar">
    <div class="brand">Oil &amp; Gas Tycoon</div>
    <div class="tb-group">
      <span id="turn-label">Turn 1</span>
    </div>
    <div class="tb-group" title="World market price of refined fuel">
      <span class="tb-caption">World price</span>
      <span id="price-label">$100.00</span>
      <canvas id="price-spark" width="72" height="22"></canvas>
    </div>
    <div class="tb-group" title="Your cash on hand">
      <span class="tb-caption">Cash</span>
      <span id="cash-label">$50.00M</span>
    </div>
    <button id="btn-next" class="primary" title="Resolve the next turn (Space)">Next turn ▸</button>
    <button id="btn-auto" title="Auto-play turns">▶▶ Auto</button>
    <select id="sel-speed" title="Auto-play speed">
      <option value="1">1 turn/s</option>
      <option value="2" selected>2 turns/s</option>
      <option value="5">5 turns/s</option>
    </select>
    <div class="spacer"></div>
    <div id="overlay-seg" class="seg" title="Map overlays">
      <button data-overlay="none" class="active">Map</button>
      <button data-overlay="price">Prices</button>
      <button data-overlay="flow">Flows</button>
      <button data-overlay="congestion">Congestion</button>
    </div>
    <button id="btn-legend" title="How to read the map">Legend</button>
    <button id="btn-tuning" title="Balance tuning sliders">⚙ Tuning</button>
    <button id="btn-newgame">New game</button>
  </header>

  <main id="main">
    <div id="canvas-wrap">
      <canvas id="world"></canvas>
      <canvas id="fx"></canvas>
      <div id="overlay-legend"></div>
    </div>
    <aside id="sidebar">
      <section id="suggest-panel" class="panel hidden">
        <h3>Suggested first moves</h3>
        <div id="suggest-body"></div>
      </section>
      <section class="panel">
        <h3>Your company</h3>
        <div id="dash-body"></div>
        <canvas id="chart-profit"></canvas>
      </section>
      <section class="panel">
        <h3>Market</h3>
        <div id="market-body"></div>
        <canvas id="chart-price"></canvas>
      </section>
      <section class="panel">
        <h3>Inspector</h3>
        <div id="inspector-body"><p class="hint">Click a node or edge on the map to inspect it and build.</p></div>
      </section>
    </aside>
  </main>

  <div id="tooltip" class="hidden"></div>
  <div id="toasts"></div>
  <div id="tuning-drawer"></div>
  <div id="modal-root"></div>

  <script src="vendor/delaunator.min.js"></script>
  <script src="js/util.js"></script>
  <script src="js/config.js"></script>
  <script src="js/mapGenerator.js"></script>
  <script src="js/gameState.js"></script>
  <script src="js/pathfinding.js"></script>
  <script src="js/market.js"></script>
  <script src="js/turnEngine.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/tuningMenu.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/onboarding.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
